name: Idea or feature request
description: Suggest an improvement to the installer.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do
      description: Describe the need rather than the solution; say what you cannot do today with the installer.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it, if you have something in mind.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11
